[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "childbex-ml"
description = "ChildBEx ML side: versioned CT slice preprocessing (no training yet)."
requires-python = ">=3.12,<3.13"
dynamic = ["version"]
# Exact pins: preprocessing determinism is only claimed for this environment.
dependencies = ["pydicom==3.0.2", "numpy==2.1.3"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.setuptools.dynamic]
version = { attr = "childbex_ml.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"childbex_ml.preprocessing" = ["presets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
