name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
  pull_request:
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node / Nx
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Nx 21 and Vite 7 support Node 24; Node 20 is EOL and crashes during ESM config loading.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint, test, build and typecheck
        run: NX_DAEMON=false NX_VERBOSE_LOGGING=true npx nx run-many -t lint test build typecheck --parallel=1 --outputStyle=stream --verbose

  postgres-integration:
    # Mandatory gate (#71): the backend integration suites skip without
    # TEST_DATABASE_URL, so the Node / Nx job does not exercise them.
    # scripts/ci/postgres-integration-gate.js fails on a missing/unreachable
    # database, a missing suite, any skipped test or zero tests.
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        # Disposable, synthetic-only server for this job. Keep the major in
        # line with production (check `pg_lsclusters` on the server).
        image: postgres:16
        env:
          POSTGRES_USER: childbex_ci
          POSTGRES_PASSWORD: childbex_ci_synthetic
          POSTGRES_DB: childbex_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U childbex_ci -d childbex_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Synthetic credentials of the service container above (not a secret).
      TEST_DATABASE_URL: postgres://childbex_ci:childbex_ci_synthetic@localhost:5432/childbex_ci_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Self-test the gate
        run: node scripts/ci/postgres-integration-gate.js --self-test

      - name: Run PostgreSQL integration suites
        run: node scripts/ci/postgres-integration-gate.js

  python:
    name: Python / LLM service
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/llm-service

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/llm-service/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify dependencies
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Import FastAPI app
        run: python -c "import main; assert main.app is not None"

  ops:
    name: Ops scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate production script syntax
        run: |
          bash -n ops/deploy/childbex-app-deploy
          bash -n ops/deploy/childbex-ml-deploy
          bash -n ops/install/install-production-deploy.sh
          bash ops/tests/test-certbot-hooks.sh
          bash ops/tests/test-origin-ssl-monitoring.sh
          bash -n ops/install/install-metrics-tailnet-proxy.sh
          bash ops/tests/test-metrics-tailnet-proxy.sh
          bash -n ops/install/install-keycloak-release-monitor.sh
          bash -n ops/install/install-keycloak-release-rules.sh
          python3 -B ops/keycloak/release-check.py --self-test
          # Prevent reintroducing explicit root identity; root is the service default.
          if grep -Eq '^[[:space:]]*(User|Group)[[:space:]]*=[[:space:]]*root' ops/keycloak/childbex-keycloak-release-check.service; then
            echo 'ERROR: explicit root user/group breaks Keycloak version checker sandbox' >&2
            exit 1
          fi
          bash ops/tests/test-node-exporter-collectors.sh
          bash ops/tests/test-node-exporter-socket-activation.sh
