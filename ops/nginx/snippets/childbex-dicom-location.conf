# Include ONLY inside the HTTPS app.childbex.com server block.
# Route-specific limit overrides the inherited server-level req_per_ip policy.
# The application still authenticates and authorizes every DICOM request.
location ~ ^/api/v1/patients/[^/]+/images/[^/]+/file$ {
    # Provisional settings for multi-hundred-slice studies; validate with
    # real production timings before considering this final capacity sizing.
    # At most 40 excessive requests run immediately, further requests wait.
    limit_req zone=dicom_per_ip burst=400 delay=40;

    proxy_pass http://127.0.0.1:3111;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
