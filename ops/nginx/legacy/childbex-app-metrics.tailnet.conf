server {
    listen 100.117.155.53:9200;
    server_name _;

    location = /metrics {
        proxy_pass http://127.0.0.1:3111/metrics;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        return 404;
    }
}
