# Repository-owned (Issue #24): /etc/nginx/conf.d/childbex-app-metrics.conf
# Installed only by ops/install/install-metrics-tailnet-proxy.sh.
#
# Loopback only. The tailnet address 100.117.155.53:9200 is owned by
# childbex-metrics-tailnet.socket (systemd, FreeBind) and forwarded here, so
# Nginx never binds a Tailscale address and starts whether or not Tailscale
# is ready. Identical to the previous server-local file except the listen line.
#
# No authentication here on purpose: the backend enforces Basic Auth, and
# Nginx passes the Authorization header through unchanged.
server {
    listen 127.0.0.1:9200;
    server_name _;

    location = /metrics {
        proxy_pass http://127.0.0.1:3111/metrics;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        return 404;
    }
}
