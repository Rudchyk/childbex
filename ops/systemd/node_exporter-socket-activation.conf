# Install only as node_exporter.service.d/zzzz-childbex-socket.conf.
# This MUST sort after existing textfile.conf AND zz-childbex-collectors.conf.
# Never modify/remove the original collector selection or hardening settings.
[Unit]
Requires=node_exporter.socket
After=node_exporter.socket

[Service]
ExecStart=
ExecStart=/usr/local/bin/node_exporter \
  --web.systemd-socket \
  --collector.textfile.directory=/var/lib/node_exporter/textfile_collector \
  --no-collector.bcachefs \
  --no-collector.bonding \
  --no-collector.fibrechannel \
  --no-collector.infiniband \
  --no-collector.ipvs \
  --no-collector.nfs \
  --no-collector.nfsd \
  --no-collector.nvme \
  --no-collector.tapestats \
  --no-collector.timex \
  --no-collector.zfs
