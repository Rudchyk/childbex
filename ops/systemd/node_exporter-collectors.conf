# ChildBEx Issue #64: disable only collectors not applicable to this VPS.
# Install as /etc/systemd/system/node_exporter.service.d/zz-childbex-collectors.conf.
# Keep the tailnet listener and textfile directory from the existing service.
# zz- is intentional: systemd parses this after the existing textfile.conf drop-in.
# Issue #65 tracks the independent Tailscale address boot race.
[Service]
ExecStart=
ExecStart=/usr/local/bin/node_exporter \
  --web.listen-address=100.117.155.53:9100 \
  --collector.textfile.directory=/var/lib/node_exporter/textfile_collector \
  --no-collector.bcachefs \
  --no-collector.bonding \
  --no-collector.fibrechannel \
  --no-collector.infiniband \
  --no-collector.ipvs \
  --no-collector.nfs \
  --no-collector.nfsd \
  --no-collector.nvme \
  --no-collector.tapestats \
  --no-collector.timex \
  --no-collector.zfs
